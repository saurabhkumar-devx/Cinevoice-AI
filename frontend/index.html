<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cinevoice AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #111827);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.08);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            resize: vertical;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.25);
            color: white;
            font-size: 16px;
            outline: none;
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        textarea:focus {
            border-color: #818cf8;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        button {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        #generateBtn {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        #clearBtn {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .response-card {
            margin-top: 30px;
            padding: 22px;
            border-radius: 15px;
            background: rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            line-height: 1.7;
            color: #e2e8f0;
        }

        .response-title {
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        #response h1,
        #response h2,
        #response h3 {
            margin: 15px 0 8px;
            color: white;
        }

        #response p {
            margin-bottom: 12px;
        }

        #response ul,
        #response ol {
            margin: 10px 0 15px 25px;
        }

        #response strong {
            color: white;
        }

        .loading {
            color: #a5b4fc;
        }

        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 30px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎬 Cinevoice AI</h1>

        <p class="subtitle">
            Ask anything and get an AI-powered response.
        </p>

        <textarea
            id="prompt"
            placeholder="Enter your prompt here..."
        ></textarea>

        <div class="buttons">

            <button id="generateBtn" onclick="generateResponse()">
                ✨ Generate Response
            </button>

            <button id="clearBtn" onclick="clearAll()">
                🗑️ Clear
            </button>

        </div>

        <div class="response-card">

            <div class="response-title">
                🤖 AI Response
            </div>

            <div id="response">
                Your AI response will appear here...
            </div>

        </div>

    </div>

    <!-- Markdown library -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        async function generateResponse() {

            const prompt = document.getElementById("prompt").value;
            const responseBox = document.getElementById("response");
            const generateBtn = document.getElementById("generateBtn");

            if (!prompt.trim()) {
                responseBox.innerText = "Please enter a prompt.";
                return;
            }

            generateBtn.disabled = true;

            responseBox.innerHTML =
                '<span class="loader"></span> Generating AI response...';

            responseBox.classList.add("loading");

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/generate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            text: prompt
                        })
                    }
                );

                const data = await response.json();

                responseBox.classList.remove("loading");

                if (data.response) {

                    responseBox.innerHTML = marked.parse(
                        data.response
                    );

                } else {

                    responseBox.innerText =
                        "Something went wrong. Please try again.";
                }

            } catch (error) {

                responseBox.classList.remove("loading");

                responseBox.innerText =
                    "Unable to connect to Cinevoice AI backend.";

                console.error(error);

            } finally {

                generateBtn.disabled = false;
            }
        }


        function clearAll() {

            document.getElementById("prompt").value = "";

            document.getElementById("response").innerHTML =
                "Your AI response will appear here...";
        }
    </script>

</body>
</html>
